org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# AGP 8.7.3 predates API 36 and warns that it has not been tested against it.
# Acknowledged rather than silenced blindly: the app compiles no API 36 symbols
# — targetSdk 36 is purely Play's floor from 31 Aug 2026 — and the full suite is
# green against it. Upgrading AGP is the real fix and is worth doing on its own,
# away from a release.
android.suppressUnsupportedCompileSdk=36
